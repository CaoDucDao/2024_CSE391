<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tiny.cloud/1/no-api-key/tinymce/6/tinymce.min.js" referrerpolicy="origin"></script>
    <script>
        tinymce.init({
        selector: '#notes',
        height: 200,
        menubar: false,
        toolbar: 'bold italic underline | alignleft aligncenter alignright | bullist numlist outdent indent | removeformat',
        branding: false,
        plugins: 'lists',
        skin: 'oxide',
        content_css: 'default',
        });
    </script>


    <style>
        body {
            width: 800px;
            margin: auto;
        }
        legend {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 600;
            font-size: 18px;
        }
        label {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 600;
            font-size: 14px;
        }
        .form-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 0px 15px 15px 15px;
        }
        .form-row > :first-child {
            flex: 0 0 20%;
            text-align: left;
        }
        .form-row > :last-child {
            flex: 0 0 80%;
            text-align: left;
            
        }
        .radio-column {
            display: flex;
            flex-direction: column;
            gap: 5px; /* khoảng cách giữa các phần tử */
        }

        .radio-column label[name="click"]{
            text-align: center;
        }
        select {
            height: 30px;
            border-radius: 6px;
            border: 2px solid rgb(68, 68, 68);
        }
        input {
            height: 20px;
            border-top: 3px solid rgb(68, 68, 68);
        }
        .tox {
            z-index: 1000 !important;
        }

        .tox-edit-area__iframe {
            pointer-events: auto !important;
        }
        .form-row > #notes,
        .form-row > .tox-tinymce {
            flex: 1 1 auto !important;
        }
        img {
            height: 40px;
        }

        .button-container {
            width: 100%;
            background-color: aqua;
            display: flex;
            justify-content: end;
            margin: 10px 0px 30px 0px;
        }
        button {
            margin-right: 10px;
            background-color: #333333;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 2px;
            font-size: 14px;
            cursor: pointer;
            align-items: center;
        }
        button:hover {
            background-color: #555;
        }

    </style>
</head>
<body>
    <form>
        <fieldset>
            <legend>Basic Info</legend>
            <div>
                <div class="form-row">
                    <label for="employeeId">Employ ID</label>
                    <label for="employeeId">9</label>
                </div>
                <div class="form-row">
                    <label for="lastName">Last Name</label>
                    <label for="lastName">Dodsworth</label>
                </div>
                <div class="form-row">
                    <label for="firstName">First Name</label>
                    <input type="text" name="employeeId">
                </div>
                <div class="form-row">
                    <label name="gender" for="gender">Gender</label>
                    <div class="radio-column">
                        <label><input type="radio" name="gender" value="male"> Male</label>
                        <label><input type="radio" name="gender" value="female"> Female</label>
                        <label><input type="radio" name="gender" value="xxx"> XXX</label>
                        <label><input type="radio" name="gender" value="zzz"> ZZZ</label>
                    </div>
                </div>

                <div class="form-row">
                    <label for="title">Title</label>
                    <input type="text" name="title">
                </div>
                <div class="form-row">
                    <label for="surfix">Surfix</label>
                    <input type="text" name="surfix">
                </div class="form-row">
                <div class="form-row">
                    <label for="birthDate">Birth Date</label>
                    <input type="datetime" name="birthDate">
                </div>
                <div class="form-row">
                    <label for="hireDate">Hiredate</label>
                    <input type="datetime" name="hireDate">
                </div>

                <div class="form-row">
                    <label for="ssn">SSN # (if applicable)</label>
                    <input name="ssn">
                </div>
                <div class="form-row">
                    <label for="repostTo">Reports To</label>
                    <select name="repostTo" id="repostTo">
                        <option value="buchanan">Buchanan</option>
                        <option value="hamilton">Hamilton</option>
                        <option value="jackson">Jackson</option>
                    </select>
                </div>
            </div>
        </fieldset>

        <!-- Contact Info -->
    <fieldset>
        <legend>Contact Info</legend>
        <div class="form-row">
            <label for="email">Email</label>
            <input type="email" name="email" id="email" placeholder="name@example.com">
        </div>
        <div class="form-row">
            <label for="address">Address</label>
            <input type="text" name="address" id="address">
        </div>
        <div class="form-row">
            <label for="city">City</label>
            <input type="text" name="city" id="city">
        </div>
        <div class="form-row">
            <label for="region">Region</label>
            <input type="text" name="region" id="region">
        </div>
        <div class="form-row">
            <label for="postalCode">Postal Code</label>
            <input type="text" name="postalCode" id="postalCode">
        </div>
        <div class="form-row">
            <label for="country">Country</label>
            <select name="country" id="country">
                <option value="russian">Russian Federation</option>
                <option value="uk">United Kingdom</option>
                <option value="us">United States</option>
            </select>
        </div>
        <div class="form-row">
            <label for="phone">US Home Phone</label>
            <input type="tel" name="phone" id="phone">
        </div>
        <div class="form-row">
            <label for="photo">Photo</label>
            <input type="file" name="photo" id="photo">
        </div>
    </fieldset>

    <!-- Optional Info -->
    <fieldset>
        <legend>Optional Info</legend>
         <div class="form-row">
            <label for="notes">Notes</label>
            <textarea id="notes" rows="5" cols="50">Anne has a BA degree in English from St. Lawrence College. She is fluent in French and German.ZZZ</textarea>
        </div>
        <div class="form-row">
            <label>Preferred Shift</label><br>
            <div class="radio-column">
                <label><input type="checkbox" name="shift" value="regular"> Regular</label>
                <label><input type="checkbox" name="shift" value="graveyard"> Grave Yard</label>
            </div>
        </div>
        <div class="form-row">
            <label for="active">Active?</label>
            <label><input type="checkbox"></label>
        </div>
        <div class="form-row">
            <label for="captcha">Are you human?</label><br>
            <div>
                <img src="captcha.png" alt="captcha"><br>
                <div class="radio-column">
                    <label name="click">Click to change</label>
                    <input type="text" name="captcha" id="captcha">
                </div>
            </div>
        </div>
    </fieldset>

    <!-- Submit & Cancel -->
    <div class="button-container">
        <button type="submit"><span>&#10003;</span> Submit</button>
        <button type="reset"><span>&#10005;</span> Cancel</button>
    </div>
    </form>
</body>
</html>
